[env:huzzah]
platform = espressif8266
board = huzzah
framework = arduino
monitor_speed = 9600
lib_deps = 
	arduino-libraries/Stepper@^1.1.3
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	waspinator/AccelStepper@^1.64
