@startuml
skinparam classAttributeIconSize 0
hide circle
skinparam linetype polyline

class Carte {
 - ISBN : string
 - autor : string
 - titlu : string
 - categorie : string
 - coperta : string
 - pret : float
 - nr_pagini : int
 
 + creaza() : bool
 + actualizeaza() : bool
 + sterge() : bool
 + vizualizeazaInformatii() : void
}

class ContainerCarti {
 - nr_carti : int
 - valoare_totala : float
 - carti : Carte[]
}

class LibrariePersonala {
 + descarcaCarte() : bool
}

class CosProduse {
- transferaCarti() : bool
+ adaugaProdus() : bool
+ eliminaProdus() : bool
+ achitaProduse() : bool
}

ContainerCarti "1" o-l- "0..*" Carte 

LibrariePersonala -u-|> ContainerCarti
CosProduse -u-|> ContainerCarti


Utilizator "1" *-u- "1" CosProduse 
Utilizator "1" *-u- "1" LibrariePersonala

@enduml

