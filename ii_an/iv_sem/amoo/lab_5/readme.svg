@startuml
skinparam classAttributeIconSize 0
hide circle
skinparam linetype polyline
'left to right direction

class Utilizator {
 - email : string
 - nume : string
 - prenume : string
 - parola : string
 - librariePersonala : LibrariePersonala
 - cosProduse : CosProduse

 + registrare() : bool
 + autentificare() : bool
 + resetareParola() : bool
 + cautaCarte() : Carte[]
}

class Client {
- recenzii : Recenzie[]
}

class Autor {
 + incarcaCarte() : bool
 + modificaCarte() : bool
 + stergeCarte() : bool
}

class Administrator {
 + stergeUtilizator() : bool
}

class Recenzie {
 - ISBN_carte : string
 - nota : int
 - comentariu : string
 + afiseaza() : string
}

Client - -|> Utilizator
Autor - -|> Utilizator
Administrator - -|> Utilizator
Administrator -l-|> Autor

Client "1" *-u- "0..*" Recenzie

@enduml

