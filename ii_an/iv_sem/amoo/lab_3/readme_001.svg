x2="428.5" y1="1062.9622" y2="1062.9622"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127" x="288" y="1057.1532">Returneaza raspuns()</text><line style="stroke:#A80036;stroke-width:1.0;" x1="36.5" x2="46.5" y1="1094.6682" y2="1090.6682"/><line style="stroke:#A80036;stroke-width:1.0;" x1="36.5" x2="46.5" y1="1094.6682" y2="1098.6682"/><line style="stroke:#A80036;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="36.5" x2="262.5" y1="1094.6682" y2="1094.6682"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107" x="96.5" y="1088.8592">Afiseaza raspuns()</text><!--MD5=[ccbd662201946e974aa504d80274a9cd]
@startuml
mainframe Gestionare carti
skinparam sequenceMessageAlign center
hide footbox

actor Autor as autor
participant "Pagina Web" as p1
participant Server as p2
activate autor

autor ->> p1: Introduce carte()
activate p1
deactivate p1
autor ->> p1: Introduce informatii carte()
activate p1
deactivate p1
autor -> p1: Incarca carte()
activate p1
p1 -> p2: Post(carte)
activate p2
p2 -> p2: Verifica permisiuni(autor||administrator)
p2 - ->> p1: Returneaza raspuns()
deactivate p2
p1 - ->> autor: Afiseaza raspuns()
deactivate p1

autor ->> p1: Selecteaza carte()
activate p1
deactivate p1

autor -> p1: Apasa stergere(carteID)
activate p1
p1 -> p2: Delete(carteID)
activate p2
p2 -> p2: Verifica permisiuni(autorID||administrator)
p2 -> p2: Delete(carteID)
activate p2
deactivate p2
p2 - ->> p1: Returneaza raspuns()
deactivate p2
p1 - ->> autor: Afiseaza raspuns()
deactivate p1



autor ->> p1: Apasa editare(carteID)
activate p1
deactivate p1

autor ->> p1: Modifica date(carteID)
activate p1
deactivate p1

autor -> p1: Apasa 'salveaza modificari'(carteID)
activate p1
p1 -> p2: Update(carteID)
activate p2
p2 -> p2: Verifica permisiuni(autorID||administrator)
p2 -> p2: Update(carteID)
activate p2
deactivate p2
p2 - ->> p1: Returneaza raspuns()
deactivate p2
p1 - ->> autor: Afiseaza raspuns()
@enduml

